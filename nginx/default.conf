map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 5291;
    server_name _;
    client_max_body_size 205m;
    client_body_timeout 600s;

    error_page 413 = @upload_too_large;

    location @upload_too_large {
        default_type application/json;
        return 413 '{"detail":"上传内容超过服务器限制：业务文件最大 200 MB，模型包最大 1024 MB。"}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        # 大型扫描 PDF 逐页 OCR 可能需要较长时间；页面会同时轮询任务进度。
        proxy_send_timeout 3660s;
        proxy_read_timeout 3660s;
    }

    # 仅模型包导入端点允许较大请求，避免扩大其他匿名 API 的请求体攻击面。
    location = /api/model/artifacts/ {
        client_max_body_size 1025m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_send_timeout 3660s;
        proxy_read_timeout 3660s;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
