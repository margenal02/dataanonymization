services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-data_anonymization}
      MYSQL_USER: ${MYSQL_USER:-anonymizer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-anonymizer-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" --silent -e 'SELECT 1' >/dev/null"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key-change-me}
      MAPPING_ENCRYPTION_KEY: ${MAPPING_ENCRYPTION_KEY:-local-dev-mapping-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-data_anonymization}
      MYSQL_USER: ${MYSQL_USER:-anonymizer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-anonymizer-local-password}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
      UIE_ENABLED: ${UIE_ENABLED:-1}
      UIE_MODEL: ${UIE_MODEL:-uie-micro}
      UIE_MANAGER_URL: http://127.0.0.1:8765
      UIE_POSITION_PROB: ${UIE_POSITION_PROB:-0.45}
      UIE_PERSON_PROB: ${UIE_PERSON_PROB:-0.70}
      UIE_ORGANIZATION_PROB: ${UIE_ORGANIZATION_PROB:-0.55}
      UIE_ADDRESS_PROB: ${UIE_ADDRESS_PROB:-0.60}
      UIE_LOCATION_PROB: ${UIE_LOCATION_PROB:-0.60}
      UIE_PRODUCT_PROB: ${UIE_PRODUCT_PROB:-0.60}
      UIE_BATCH_SIZE: ${UIE_BATCH_SIZE:-2}
      UIE_MAX_SEQ_LEN: ${UIE_MAX_SEQ_LEN:-512}
      UIE_MAX_TOTAL_CHARS: ${UIE_MAX_TOTAL_CHARS:-500000}
      UIE_START_TIMEOUT_SECONDS: ${UIE_START_TIMEOUT_SECONDS:-180}
      UIE_REQUEST_TIMEOUT_SECONDS: ${UIE_REQUEST_TIMEOUT_SECONDS:-600}
      PDF_OCR_ENABLED: ${PDF_OCR_ENABLED:-1}
      PDF_OCR_LANGUAGES: ${PDF_OCR_LANGUAGES:-chi_sim+eng}
      PDF_OCR_DPI: ${PDF_OCR_DPI:-180}
      PDF_OCR_MAX_IMAGE_DIMENSION: ${PDF_OCR_MAX_IMAGE_DIMENSION:-3508}
      PDF_OCR_MIN_TEXT_CHARS: ${PDF_OCR_MIN_TEXT_CHARS:-12}
      PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES:-300}
      PDF_OCR_MAX_TOTAL_CHARS: ${PDF_OCR_MAX_TOTAL_CHARS:-500000}
      PDF_OCR_PAGE_TIMEOUT_SECONDS: ${PDF_OCR_PAGE_TIMEOUT_SECONDS:-180}
      TZ: Asia/Shanghai
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "5291:5291"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  mysql_data:
  media_data:
  static_data:
